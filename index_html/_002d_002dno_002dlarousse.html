<h4 class="subsection" id="g_t_002d_002dno_002dlarousse-1"><span>6.1.3 &ndash;no-larousse<a class="copiable-link" href="#g_t_002d_002dno_002dlarousse-1"> &para;</a></span></h4>

<p>By default, the FCC program compiles with the Larousse sources included.
See the <a class="ref" href="Larousse.html">larousse</a> section.
</p>
<p>This flag allows compilation without any files from the Larousse
library.
