<h4 class="subsection" id="Initialization-1"><span>5.2.1 Initialization<a class="copiable-link" href="#Initialization-1"> &para;</a></span></h4>

<p>By default, the stack should be initialized with 8 bytes representing
the return value of the program. The default value is
implementation-defined.
